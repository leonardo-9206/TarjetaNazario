<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fondo de Pantalla & Tarjeta Digital | M. en C. Luis Nazario</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-orange: #f26522;
      --brand-gold: #f59e0b;
      --brand-dark: #1e293b;
      --brand-black: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #334155;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 60px;
    }

    /* Floating Control Bar for customization & download */
    .controls-panel {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 24px;
      color: #f8fafc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .controls-panel h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .url-input-group {
      margin-bottom: 12px;
    }

    .url-input-group label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .url-input-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-family: monospace;
      outline: none;
      transition: border 0.2s;
    }

    .url-input-group input:focus {
      border-color: #f59e0b;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      font-weight: 800;
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.3);
      transition: transform 0.2s;
    }

    .btn-secondary {
      background: #334155;
      color: #f8fafc;
      font-weight: 600;
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary:active, .btn-secondary:active {
      transform: scale(0.98);
    }

    /* THE CARD (MATCHING USER REFERENCE DESIGN) */
    .card-canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      border-radius: 28px;
      overflow: hidden;
    }

    .card-preview {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 24px 40px;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Side graphical pill accents from reference photo */
    .side-pill-left {
      position: absolute;
      top: -20px;
      left: 0;
      width: 28px;
      height: 420px;
      background: #f59e0b;
      border-top-right-radius: 24px;
      border-bottom-right-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 30px 0;
      z-index: 2;
    }

    .side-pill-right {
      position: absolute;
      bottom: -20px;
      right: 0;
      width: 28px;
      height: 420px;
      background: #f59e0b;
      border-top-left-radius: 24px;
      border-bottom-left-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 30px 0;
      z-index: 2;
    }

    .pill-notch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
    }

    /* Top Logo Circle */
    .logo-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 5px solid #f59e0b;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
      z-index: 5;
      margin-top: 10px;
    }

    .logo-circle img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Typography Info */
    .info-container {
      text-align: center;
      z-index: 5;
      margin: 10px 0 0;
      width: 100%;
      padding: 0 10px;
    }

    .person-name {
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .person-title {
      font-size: 14px;
      font-weight: 700;
      color: #d97706;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    .person-email {
      font-size: 15px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .person-phones {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.02em;
    }

    .person-company {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 0.08em;
    }

    /* QR Code Frame with Speech Bubble */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
      margin-top: 10px;
    }

    .qr-frame {
      border: 6px solid #f59e0b;
      border-radius: 24px;
      padding: 12px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(245, 158, 11, 0.2);
      position: relative;
    }

    #qrContainer {
      display: block;
    }

    #qrContainer img, #qrContainer canvas {
      display: block;
      margin: 0 auto;
    }

    /* Speech Bubble Tag below QR */
    .speech-bubble {
      position: relative;
      background: #f59e0b;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 10px 22px;
      border-radius: 12px;
      margin-top: 14px;
      text-transform: uppercase;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 8px 8px 8px;
      border-style: solid;
      border-color: transparent transparent #f59e0b transparent;
    }

    /* Footer URL */
    .card-footer {
      z-index: 5;
      text-align: center;
      margin-top: auto;
      padding-top: 10px;
    }

    .card-footer a, .card-footer span {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Controls Panel -->
  <div class="controls-panel">
    <h3>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Ajustes de la Tarjeta
    </h3>

    <div class="url-input-group">
      <label>URL a la que apunta el QR:</label>
      <input type="text" id="targetUrlInput" value="" placeholder="https://tu-pagina-o-contacto">
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="downloadImage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar PNG HD
      </button>

      <a href="index.html" class="btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Ver Web Móvil
      </a>
    </div>
  </div>

  <!-- THE DIGITAL CARD (9:16 WALLPAPER) -->
  <div class="card-canvas-wrapper" id="cardWrapper">
    <div class="card-preview" id="cardElement">
      
      <!-- Side pill decorations -->
      <div class="side-pill-left">
        <div class="pill-notch"></div>
        <div class="pill-notch"></div>
      </div>
      <div class="side-pill-right">
        <div class="pill-notch"></div>
        <div class="pill-notch"></div>
      </div>

      <!-- Top Logo Circle -->
      <div class="logo-circle">
        <img src="logo_aliamsa.svg" alt="Aliamsa">
      </div>

      <!-- Person Information -->
      <div class="info-container">
        <h1 class="person-name">M. en C. Luis Nazario<br>Ángel Cortés</h1>
        <p class="person-title">Jefe de Mantenimiento y Servicios</p>
        <p class="person-email">nazario.angel@sabro.com.mx</p>
        <p class="person-phones">(449) 188 2184 &nbsp;|&nbsp; 910 6490 Ext. 1544</p>
        <p class="person-company">Interpec San Marcos • Planta # 2</p>
      </div>

      <!-- Center QR Code with Orange Border -->
      <div class="qr-section">
        <div class="qr-frame">
          <div id="qrContainer"></div>
        </div>
        <div class="speech-bubble">ESCANEA MI CONTACTO</div>
      </div>

      <!-- Bottom Reference / Domain -->
      <div class="card-footer">
        <span id="footerDisplay">aliamsa.com.mx</span>
      </div>

    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span>Generando Imagen en Alta Resolución...</span>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="html2canvas.min.js"></script>
  <script>
    // Init target URL from current location (index.html)
    const currentBase = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const defaultTarget = currentBase + 'index.html';

    const urlInput = document.getElementById('targetUrlInput');
    urlInput.value = defaultTarget;

    let qrCodeObj = null;

    function renderQR(text) {
      const qrContainer = document.getElementById('qrContainer');
      qrContainer.innerHTML = '';
      
      // Screen width adaptive size
      const isMobile = window.innerWidth < 450;
      const size = isMobile ? 180 : 210;

      qrCodeObj = new QRCode(qrContainer, {
        text: text,
        width: size,
        height: size,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    renderQR(defaultTarget);

    urlInput.addEventListener('input', (e) => {
      const val = e.target.value.trim() || defaultTarget;
      renderQR(val);
      try {
        const parsed = new URL(val);
        document.getElementById('footerDisplay').textContent = parsed.hostname;
      } catch {
        document.getElementById('footerDisplay').textContent = val;
      }
    });

    // Export image via html2canvas
    function downloadImage() {
      const overlay = document.getElementById('loadingOverlay');
      overlay.style.display = 'flex';

      const card = document.getElementById('cardElement');

      // High scale for crystal crisp 1080p+ quality
      html2canvas(card, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false
      }).then(canvas => {
        overlay.style.display = 'none';

        const image = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'Tarjeta_Luis_Nazario_Lockscreen.png';
        link.href = image;
        link.click();
      }).catch(err => {
        overlay.style.display = 'none';
        alert('Error al generar imagen: ' + err);
      });
    }
  </script>
</body>
</html>
